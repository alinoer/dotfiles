# AeroSpace — tiling window manager
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Hyper = Caps Lock (ditahan), lewat Karabiner = ctrl + alt + cmd
#
#   Hyper + h/j/k/l          fokus window kiri/bawah/atas/kanan
#   Hyper + Shift + h/j/k/l  pindahkan window
#   Hyper + huruf            pindah workspace (T, B, C, A, D, N, M, E, 1-3)
#   Hyper + Shift + huruf    kirim window ke workspace itu
#   Hyper + Tab              workspace sebelumnya
#   Hyper + f                fullscreen
#   Hyper + Shift + f        floating <-> tiling
#   Hyper + / atau \         layout tiles / accordion
#   Hyper + - / =            resize
#   Hyper + ;                mode service (reset layout, reload, join)

start-at-login = true
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Mouse ikut pindah saat fokus pindah monitor
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = 10
outer.right      = 10

# ============================================================
# Keybinding utama (Hyper = ctrl-alt-cmd)
# ============================================================
[mode.main.binding]

# Fokus & pindah window (hjkl, sama seperti nvim & tmux)
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# Layout
ctrl-alt-cmd-slash     = 'layout tiles horizontal vertical'
ctrl-alt-cmd-backslash = 'layout accordion horizontal vertical'
ctrl-alt-cmd-f         = 'fullscreen'
ctrl-alt-cmd-shift-f   = 'layout floating tiling'

# Resize
ctrl-alt-cmd-minus = 'resize smart -50'
ctrl-alt-cmd-equal = 'resize smart +50'

# Workspace
#   T terminal   B browser   C chat   A AI      D dev tools (API/DB)
#   N notes & calendar       M music  E editor  1-3 bebas
ctrl-alt-cmd-t = 'workspace T'
ctrl-alt-cmd-b = 'workspace B'
ctrl-alt-cmd-c = 'workspace C'
ctrl-alt-cmd-a = 'workspace A'
ctrl-alt-cmd-d = 'workspace D'
ctrl-alt-cmd-n = 'workspace N'
ctrl-alt-cmd-m = 'workspace M'
ctrl-alt-cmd-e = 'workspace E'
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'

ctrl-alt-cmd-shift-t = 'move-node-to-workspace T'
ctrl-alt-cmd-shift-b = 'move-node-to-workspace B'
ctrl-alt-cmd-shift-c = 'move-node-to-workspace C'
ctrl-alt-cmd-shift-a = 'move-node-to-workspace A'
ctrl-alt-cmd-shift-d = 'move-node-to-workspace D'
ctrl-alt-cmd-shift-n = 'move-node-to-workspace N'
ctrl-alt-cmd-shift-m = 'move-node-to-workspace M'
ctrl-alt-cmd-shift-e = 'move-node-to-workspace E'
ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'

ctrl-alt-cmd-tab       = 'workspace-back-and-forth'
ctrl-alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'

ctrl-alt-cmd-semicolon = 'mode service'

# ============================================================
# Mode service: Hyper + ; lalu tekan salah satu
# ============================================================
[mode.service.binding]
esc       = ['reload-config', 'mode main']           # reload config
r         = ['flatten-workspace-tree', 'mode main']  # reset layout workspace
f         = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']

# ============================================================
# Aplikasi otomatis masuk ke workspace-nya
# Cek app-id aplikasi lain: `aerospace list-apps`
# ============================================================

# T — Terminal
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

# B — Browser
