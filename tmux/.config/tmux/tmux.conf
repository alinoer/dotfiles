##### ==================================================
##### CORE PERFORMANCE
##### ==================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 50000
set -g allow-passthrough on

##### ==================================================
##### PREFIX
##### ==================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### ==================================================
##### SPLIT
##### ==================================================
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

##### ==================================================
##### RELOAD CONFIG
##### ==================================================
unbind r
bind R source-file ~/.tmux.conf \; display-message "tmux reloaded ✔"

##### ==================================================
##### PANE NAVIGATION (VIM STYLE)
##### ==================================================
unbind h
unbind j
unbind k
unbind l

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r m resize-pane -Z

##### ==================================================
##### MOUSE & COPY MODE
##### ==================================================
set -g mouse on
setw -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

##### ==================================================
##### WINDOW BEHAVIOR
##### ==================================================
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off

##### ==================================================
##### STATUS BAR (POPULAR COMMUNITY STYLE)
##### ==================================================
set -g status on
set -g status-interval 5
set -g status-justify centre

set -g status-style bg=colour235,fg=colour250
set -g message-style bg=colour235,fg=colour223
set -g message-command-style bg=colour235,fg=colour223

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour148

setw -g window-status-format \
  '#[fg=colour244] #I:#W '

setw -g window-status-current-format \
  '#[fg=colour235,bg=colour148,bold] #I:#W #[default]'

set -g status-left-length 80
set -g status-left \
  '#[fg=colour148,bold] #S #[fg=colour238]| #[fg=colour244]#(whoami) '

set -g status-right-length 100
set -g status-right \
  '#[fg=colour244]%Y-%m-%d #[fg=colour238]| #[fg=colour146]%H:%M '

##### ==================================================
##### PLUGINS (MINIMAL & MANUAL)
##### ==================================================
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Essential navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session save / restore (MANUAL ONLY)
set -g @plugin 'tmux-plugins/tmux-resurrect'

##### ==================================================
##### RESURRECT (ANTI-HANG SETTINGS)
##### ==================================================
# DO NOT capture pane contents (VERY IMPORTANT)
set -g @resurrect-capture-pane-contents 'off'

# DO NOT auto restore on tmux start
set -g @resurrect-restore 'off'

##### ==================================================
##### KEYBINDINGS: SESSION SAVE / RESTORE
##### ==================================================
# Save session
bind s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'

# Restore session
bind r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

##### ==================================================
##### MANUAL PLUGIN LOAD (NO AUTO HANG)
##### ==================================================
# Install / load plugins only when needed
bind I run '~/.tmux/plugins/tpm/tpm'
