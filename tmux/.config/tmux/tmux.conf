##### ==================================================
##### TERMINAL & PERFORMA
##### ==================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"        # true color di terminal apa pun (Ghostty, iTerm, dll)
set -sg escape-time 10                    # Esc di nvim tidak lag
set -g focus-events on                    # nvim tahu saat pane fokus -> autoread jalan
set -g history-limit 50000
set -g allow-passthrough on               # gambar/OSC dari aplikasi di dalam tmux
set -g set-clipboard on                   # yank di tmux/nvim masuk clipboard macOS (OSC 52)

##### ==================================================
##### PREFIX: Ctrl-a
##### ==================================================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### ==================================================
##### RELOAD CONFIG: prefix R
##### ==================================================
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded ✔"

##### ==================================================
##### WINDOW & SPLIT (buka di folder yang sama)
##### ==================================================
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g detach-on-destroy off              # tutup session terakhir -> pindah ke session lain, bukan keluar

##### ==================================================
##### PANE: pindah, resize, zoom
##### ==================================================
# Ctrl-h/j/k/l (tanpa prefix) diatur oleh vim-tmux-navigator, seamless dengan nvim.
# prefix h/j/k/l tetap ada sebagai cadangan.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z                     # zoom/unzoom pane

# Ctrl-l dipakai navigator, jadi clear screen pindah ke prefix Ctrl-l
bind C-l send-keys C-l

##### ==================================================
##### MOUSE & COPY MODE (gaya vi)
##### ==================================================
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane   # drag mouse tidak langsung keluar copy mode

##### ==================================================
##### STATUS BAR
##### ==================================================
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre

# Palet coolnight (sama dengan Ghostty & nvim)
#   bg #011423  fg #CBE0F0  hijau #47FF9C  cyan #0FC5ED  ungu #A277FF  biru #214969
set -g status-style "bg=#011423,fg=#CBE0F0"
set -g message-style "bg=#143652,fg=#CBE0F0"
set -g message-command-style "bg=#143652,fg=#CBE0F0"
set -g mode-style "bg=#275378,fg=#CBE0F0"

set -g pane-border-style "fg=#214969"
set -g pane-active-border-style "fg=#47FF9C"

setw -g window-status-format '#[fg=#627E97] #I:#W '
setw -g window-status-current-format '#[fg=#011423,bg=#47FF9C,bold] #I:#W #[default]'

set -g status-left-length 80
set -g status-left '#[fg=#0FC5ED,bold] #S #[fg=#214969]| #[fg=#627E97]#(whoami) '

set -g status-right-length 100
set -g status-right '#[fg=#627E97]%Y-%m-%d #[fg=#214969]| #[fg=#A277FF]%H:%M '

##### ==================================================
##### PLUGINS (TPM)
##### ==================================================
# Plugin tetap di ~/.tmux/plugins (di luar repo dotfiles)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l lintas pane tmux & nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix Ctrl-s simpan, prefix Ctrl-r restore

# Resurrect: ringan & manual (tidak auto restore, tidak simpan isi pane)
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-restore 'off'

# TPM wajib di baris paling bawah.
# prefix I = install plugin, prefix U = update, prefix alt-u = hapus yang tidak dipakai
if-shell "test -f ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
